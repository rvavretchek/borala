# DEFINIÇÕES DE STATUS:
# =====================
# Status do épico:
#   - backlog: épico ainda não iniciado
#   - in-progress: épico em desenvolvimento ativo
#   - done: todas as histórias do épico concluídas
#
# Transições do épico:
#   - backlog → in-progress: automaticamente quando a primeira história é criada
#   - in-progress → done: manualmente quando todas as histórias chegam a done
#
# Status da história:
#   - backlog: história existe somente no documento de épicos
#   - ready-for-dev: arquivo dedicado da história foi criado
#   - in-progress: implementação em andamento
#   - review: pronta para revisão de código
#   - done: história concluída
#
# Status da retrospectiva:
#   - optional: pode ser realizada, mas não é obrigatória
#   - done: retrospectiva concluída
#
# Status de item de ação:
#   - open: compromisso ainda não tratado
#   - in-progress: tratamento em andamento
#   - done: item concluído
#
# NOTAS DO WORKFLOW:
# ==================
# - O épico passa a in-progress quando sua primeira história é criada.
# - Histórias podem avançar em paralelo quando houver capacidade.
# - A próxima história normalmente é criada após a anterior chegar a done.
# - A implementação move a história para review antes da revisão de código.
# - A retrospectiva pode acrescentar compromissos em action_items.

